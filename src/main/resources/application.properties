spring.application.name=cid-gen

# The second character of every CID. Change this to start a new CID range.
cid.range-letter=D

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:cid_gen}
spring.datasource.username=${DATABASE_USERNAME:cid_gen}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway owns the database schema. Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
